<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de leitura</title>
</head>
<body>
    
    <form action="" method="post">
        <label>
        Titulo do livro:<input type="text" name="title">
        </label> 
        <label>
        Data do fim da leitura:<input type="date" name="date">
        </label>
        <br>   
        <label>
        Autor:<input type="text" name="writter">
        </label>
        <br>
        <label>
        O que você achou sobre o livro:<textarea name="opinion"></textarea>
        </label>
        <br>     
        <label>
        Primeira cor que você pensou enquanto escrevia esse formulario:<input type="color" name="color">
        </label>
        <br>   
        <label>
        Estou preenchendo esse formulario:<input type="checkbox" name="confirmation1">
        </label>
        <label>
        Tenho certeza que estou preenchendo esse formulario:<input type="checkbox" name="confirmation2">
        </label>
        <br>   
        <label>
        De 0 a 10 qual nota você da para esse livro:<input type="range" min="0" max="10" name="opnion2">
        </label>
        <br>   
        <label>
        Digite a sua pagina favorita:<input type="number" name="fav.page">
        </label>
        <br>            
        <label>
        Digite uma boa hora para ler:<input type="time" name="good.readingtime">
        </label>
        <br>
        <label>
        Selecione sua semana do mes que você mais leu:<input type="week" name="favorite.week">
        </label>
        <br>
        <label>
        Digite um horario de leitura:<input type="datetime-local" name="readingtime2">
        </label>
        <br>
        <label>
        Envie uma foto do livro:<input type="file" name="book.photo">
        </label>
        <br>
        <label>
        <input type="submit">
        <input type="reset">
        </label>
    </form>
    <a href="../14-08-2026/atividade.html">Volte para a pagina inicial</a>
</body>
</html>
